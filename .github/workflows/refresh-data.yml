name: Refresh index data
# Downloads daily Bank Nifty / Nifty OHLC from Yahoo Finance on GitHub's servers and saves it in data/*.csv.
on:
  workflow_dispatch:
  schedule:
    - cron: '45 11 * * 1-5'   # weekdays ~17:15 IST
permissions: { contents: write }
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: node tools/fetch-data.mjs
      - name: Commit data if changed
        run: |
          git config user.name "astro-lab-bot"
          git config user.email "astro-lab-bot@users.noreply.github.com"
          git add data/*.csv || true
          git diff --cached --quiet || (git commit -m "Refresh index data" && git push)
